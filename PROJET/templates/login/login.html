<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <link rel="stylesheet" href="src/css/style.css">
    <style>
       body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;

    background: #0f1724; /* Bleu nuit sombre */
    color: white;
    font-family: sans-serif;
}

.card {
    background: #1b2433; /* Gris-bleu utilisé dans ton jeu */
    padding: 40px;
    border-radius: 18px;
    width: 360px;
    text-align: center;

    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

h2 {
    margin-bottom: 25px;
    font-size: 24px;
    font-weight: bold;
    color: #ffffff;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: 1px solid #2d3b52;
    background: #121a26;
    color: #e6e6e6;
}

input::placeholder {
    color: #6c84a0;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;

    background: #4c8bff; /* Bleu très proche de ta sélection de monde */
    color: white;
    cursor: pointer;
    font-weight: bold;

    transition: 0.2s ease-in-out;
}

button:hover {
    background: #3f79e0;
}

.card p a {
    color: #4c8bff;
    text-decoration: none;
}

.card p {
    text-align: center;
    font-size: 15px;
    margin-top: 18px;
}

.card p a {
    color: #4c8bff;
    text-decoration: none;
}

.card p a:hover {
    text-decoration: underline;
}

    </style>
</head>
<body>

<div class="card">
    <h2>Connexion</h2>

    <input type="text" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">

    <button onclick="login()">Se connecter</button>

    <p>Pas de compte ? <a href="signup.html">Créer un compte</a></p>
</div>

<script src="src/js/auth.js"></script>
</body>
</html>
